[tool.poetry]
name = "api-behavior-learner"
version = "0.1.0"
description = "Reverse engineer API behavior from HTTP traffic logs"
authors = ["API Learner <learner@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
